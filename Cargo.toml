[workspace]
members = [".", "casket-macros"]
resolver = "2"

[package]
name = "casket"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
authors = ["SawyersPresent (https://github.com/SawyersPresent)"]
description = "A Rust library for ICS/OT protocol implementations and vendor plugin APIs — the foundation that scadaver is built on."
repository = "https://github.com/Whispergate/casket"
keywords = ["ics", "scada", "modbus", "enip", "plc"]
categories = ["network-programming", "embedded"]
license-file = "LICENSE"
readme = "README.md"
exclude = [
    "patches/",
    "QUEUE.md",
    "RULES.md",
    "ITERATION-LOG.md",
    "scadaver-impact.md",
    "docs/api-surface.txt",
]

[lib]
name = "casket"
path = "src/lib.rs"

[features]
default = []
macros = ["dep:casket-macros"]
tls    = ["dep:native-tls"]
capture = ["dep:pcap"]

[dependencies]
anyhow = "1"
thiserror = "1"
ureq = { version = "2", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
socket2 = { version = "0.5", features = ["all"] }
base64 = "0.22"
rand = "0.8"
subtle = "2"
network-interface = "2"
pcap-parser = "0.17"
native-tls = { version = "0.2", features = ["vendored"], optional = true }
pcap = { version = "2.5.0", optional = true }
casket-macros = { version = "0.1", path = "casket-macros", optional = true }

[dev-dependencies]
casket-macros = { version = "0.1", path = "casket-macros" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
